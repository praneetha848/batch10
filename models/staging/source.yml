version: 2
sources:
    - name: datafeed_shared_schema
      database: "{{('di_db')}}"
      schema: raw_schema
      tables:
        - name: raw_product
        - name: raw_customerdata
        - name: emp_sal
        - name: raw_orders
          columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: status 
            tests:
              - accepted_values:
                  values: ['placed', 'shipped', 'completed', 'returned']  
        - name: raw_customers
          columns:
            - name: id
              tests:
                - relationships:
                    to: ref('customers')
                    field: CUSTOMER_ID


        